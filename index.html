const lineAliases={'2號線支線':'2號線','1號線分支線':'1號線','1號線光明支線':'1號線','1號線西東灘支線':'1號線','2號線聖水支線':'2號線','2號線新亭支線':'2號線'};
const colorByCity={};
function buildLineColors(rows){const colors=new Map();for(const r of rows)if(r.lineName&&r.lineColor&&!colors.has(r.lineName))colors.set(r.lineName,safeColor(r.lineColor));return colors}
colorByCity.seoul=buildLineColors(rawSeoulData);
colorByCity.busan=buildLineColors(rawBusanData);
function parseTransfer(value,cityName){
 const text=String(value||'').trim();if(!text||text==='無')return null;
 const match=text.match(/^(.+?)（([^）]*)）$/);const original=match?match[1].trim():text;
 const lineName=lineAliases[original]||original;
 const color=colorByCity[cityName].get(lineName)||null;
 return {name:original,color,extra:match?match[2]:'',raw:text};
}
function splitSequences(rows,cityName){
 const grouped=new Map();for(const r of rows){if(!grouped.has(r.lineName))grouped.set(r.lineName,[]);grouped.get(r.lineName).push(r)}
 const links=new Map();const set=(row,prev,next,verified=false)=>links.set(row,{prev,next,verified});
 for(const [line,items] of grouped){
  // 避免把分支線的起點錯接在主線終點後面；優先顯示待確認而非錯誤跳轉。
  if(cityName==='seoul'&&line==='1號線'){
   const main=items.filter(r=>/^1\d\d$/.test(r.id));const south=items.filter(r=>/^P\d+/.test(r.id)&&!r.id.includes('-'));
   for(const segment of [main,south])segment.forEach((r,i)=>set(r,segment[i-1]||null,segment[i+1]||null,false));
   items.filter(r=>r.id.includes('-')).forEach(r=>set(r,null,null,false));continue;
  }
  if(cityName==='seoul'&&line==='2號線'){
   const ring=items.filter(r=>/^2\d\d$/.test(r.id));ring.forEach((r,i)=>set(r,ring[(i-1+ring.length)%ring.length],ring[(i+1)%ring.length],true));
   for(const prefix of ['211-','234-']){const arm=items.filter(r=>r.id.startsWith(prefix));arm.forEach((r,i)=>set(r,i?arm[i-1]:items.find(z=>z.id===prefix.slice(0,3))||null,arm[i+1]||null,false))}continue;
  }
  items.forEach((r,i)=>set(r,items[i-1]||null,items[i+1]||null,false));
 }
 return links;
}
function processData(rows,cityName){
 const merged=new Map(),links=splitSequences(rows,cityName);
 for(const r of rows){if(!r||!r.lineName||!r.zh)continue;
  const key=r.ko?.trim()||r.zh.trim();
  if(!merged.has(key))merged.set(key,{zh:r.zh,en:r.en||'',ko:r.ko||'',lines:[],transfers:new Map()});
  const s=merged.get(key),edge=links.get(r)||{};
  s.lines.push({name:r.lineName,id:r.id||'',color:safeColor(r.lineColor),prev:edge.prev?{zh:edge.prev.zh,id:edge.prev.id}:null,next:edge.next?{zh:edge.next.zh,id:edge.next.id}:null,verified:edge.verified});
  if(r.transfers&&r.transfers!=='無')r.transfers.split(/[、，]/).forEach(t=>{const transfer=parseTransfer(t,cityName);if(transfer)s.transfers.set(transfer.raw,transfer)});
 }
 return Array.from(merged.values()).map(s=>({...s,search:[s.zh,s.en,s.ko,...s.lines.map(l=>l.id)].join(' ').toLowerCase()}));
}
const databases={seoul:processData(rawSeoulData,'seoul'),busan:processData(rawBusanData,'busan')};
let city='seoul',visibleLimit=30,showFavorites=false,toastTimer;
const historyKey=()=>`metro_history_${city}`,favoriteKey=()=>`metro_favorites_${city}`;
function notify(message){const el=$('toast');el.textContent=message;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),2300)}
function historyAdd(s){const h=safeRead(historyKey()).filter(v=>v!==s.ko);h.unshift(s.ko);safeSave(historyKey(),h.slice(0,6));renderHistory()}
function renderHistory(){const h=safeRead(historyKey());const parent=$('historySection');parent.replaceChildren();const label=document.createElement('span');label.className='muted';label.textContent='最近查過：';parent.append(label);if(!h.length){const empty=document.createElement('span');empty.className='muted';empty.textContent='暫無紀錄';parent.append(empty);return}for(const ko of h){const st=databases[city].find(s=>s.ko===ko);if(!st)continue;const btn=document.createElement('button');btn.className='chip';btn.textContent=st.zh;btn.type='button';btn.addEventListener('click',()=>quickSearch(st.zh));parent.append(btn)}}
function quickSearch(value){$('searchInput').value=value;showFavorites=false;$('favoritesOnly').setAttribute('aria-pressed','false');$('favoritesOnly').classList.remove('active');visibleLimit=30;render();$('searchInput').focus()}
function populateLines(){const select=$('lineSelect');select.replaceChildren(new Option('全部路線',''));const seen=new Set();for(const st of databases[city])for(const l of st.lines)seen.add(l.name);for(const l of seen)select.add(new Option(l,l))}
function setCity(next){city=next;$('searchInput').value='';visibleLimit=30;showFavorites=false;$('favoritesOnly').setAttribute('aria-pressed','false');$('favoritesOnly').classList.remove('active');for(const c of ['seoul','busan']){$('btn-'+c).classList.toggle('active',c===next);$('btn-'+c).setAttribute('aria-pressed',String(c===next))}$('cityStatus').textContent=(city==='seoul'?'首爾':'釜山')+'站點';populateLines();renderHistory();updateMap();render()}
function updateMap(){const m=cityMaps[city];$('mapTitle').textContent=m.title;$('mapLink').href=m.url;const body=$('mapBody');body.replaceChildren();if(m.type==='pdf'){const frame=document.createElement('iframe');frame.title=m.title;frame.loading='lazy';frame.src=m.url;body.append(frame)}else{const img=document.createElement('img');img.src=m.url;img.alt=m.title;img.loading='lazy';body.append(img)}}
function lineBadge(l){return `<span class="line" style="background:${safeColor(l.color)}"><b>${escapeHTML(l.id)}</b>${escapeHTML(l.name)}</span>`}
function navButton(s){if(!s)return '<span class="muted">端點／分支待確認</span>';return `<button class="neighbor" type="button" data-search="${escapeHTML(s.zh)}">[${escapeHTML(s.id)}] ${escapeHTML(s.zh)}</button>`}
function transferBadge(t){
 if(!t.color)return `<span class="transfer-note">${escapeHTML(t.raw)}</span>`;
 const label=t.name+(t.extra?' · '+t.extra:'');
 return `<span class="line" style="background:${safeColor(t.color)}" title="${escapeHTML(label)}">${escapeHTML(label)}</span>`;
}
function facilitiesMarkup(st){
 const f=facilityData[`${city}:${st.ko}`];
 function rows(items,title,icon){
  if(!Array.isArray(items)||!items.length)return `<div class="facility-row"><span>${icon} ${title}</span><span class="facility-muted">本批資料未涵蓋</span></div>`;
  return items.map(it=>{
   const exit=it.exit?`${escapeHTML(it.exit)} 號出口`:'未列明出口';
   const details=[it.floors,it.direction,it.noteZh,it.locationZh].filter(Boolean).map(escapeHTML).join(' · ');
   const hasOriginal=it.note||it.location;
   const original=hasOriginal?`<details class="facility-original"><summary>查看韓文原文</summary><div>${[it.note,it.location].filter(Boolean).map(escapeHTML).join(' · ')}</div></details>`:'';
   return `<div class="facility-record"><div class="facility-record-head"><strong>${icon} ${title} · ${exit}</strong><span class="facility-muted">${escapeHTML(it.line)}號線</span></div><div class="facility-record-note">${details||'官方資料未載詳細位置'}${original}</div></div>`;
  }).join('');
 }
 const source=f?`<p class="facility-tip">資料日期：${escapeHTML(f.updated.join('、'))}。來源：${f.sources.map(t=>`<a href="${escapeHTML(t.url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(t.name)}</a>`).join('、')}。位置已優先轉為繁體中文；少數專有名詞可能保留韓文，可展開核對原文。設備資料為官方檔案當時紀錄，非即時運行狀態。</p>`:'<p class="facility-tip">這四份上傳資料沒有涵蓋此站，不能因此判定沒有設施。建議參考現場告示或營運機構資訊。</p>';
 const count=f?` · 已收錄 ${f.elevators.length+f.escalators.length+f.walkways.length} 筆設備`:' · 尚無匯入資料';
 return `<details class="facilities"><summary>♿ 查看電梯與電扶梯位置<span class="facility-summary-count">${count}</span></summary><div class="facility-content">${rows(f?.elevators,'電梯','🛗')}${rows(f?.escalators,'電扶梯','↗')}${f?.walkways?.length?rows(f.walkways,'水平步行機','↔'):''}${source}</div></details>`;
}
function renderCard(st,favorites){
 const saved=favorites.includes(st.ko),card=document.createElement('article');card.className='station';
 const transfers=[...st.transfers.values()].filter(t=>!st.lines.some(l=>t.name===l.name));
 card.innerHTML=`<div class="station-top"><div class="names"><h3>${escapeHTML(st.zh)}</h3><div class="en">${escapeHTML(st.en)}</div></div><div class="actions"><button class="ko" type="button" data-copy="${escapeHTML(st.ko)}" title="複製韓文站名">${escapeHTML(st.ko)} ⧉</button><button class="favorite" type="button" data-favorite="${escapeHTML(st.ko)}" aria-label="${saved?'移除收藏':'加入收藏'}" aria-pressed="${saved}">${saved?'★':'☆'}</button></div></div><div class="lines">${st.lines.map(lineBadge).join('')}</div><div class="route-list">${st.lines.map(l=>`<div class="route">${lineBadge(l)}<div><div class="neighbors">${navButton(l.prev)} <span class="muted">→</span> <b>${escapeHTML(st.zh)}</b> <span class="muted">→</span> ${navButton(l.next)}</div>${!l.verified?'<div class="route-warning">相鄰站依內建資料顯示，分支／方向請依現場指示確認</div>':''}</div></div>`).join('')}</div>${transfers.length?`<div class="transfer"><span class="transfer-label">🔄 可轉乘：</span>${transfers.map(transferBadge).join('')}</div>`:''}${facilitiesMarkup(st)}`;
 return card;
}
function render(){const q=$('searchInput').value.trim().toLowerCase();const line=$('lineSelect').value;const favorites=safeRead(favoriteKey());let data=databases[city].filter(s=>(!q||s.search.includes(q))&&(!line||s.lines.some(l=>l.name===line))&&(!showFavorites||favorites.includes(s.ko)));
 $('resultCount').textContent=`符合 ${data.length} 站・共 ${databases[city].length} 站`;
 const list=$('stationList');list.replaceChildren();if(!data.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=showFavorites?'目前沒有符合條件的收藏站點':'沒有找到符合條件的站點，試試其他語言或站號';list.append(empty)}else{const chunk=document.createDocumentFragment();for(const s of data.slice(0,visibleLimit))chunk.append(renderCard(s,favorites));list.append(chunk)}const more=$('showMore');more.classList.toggle('hidden',data.length<=visibleLimit);if(data.length>visibleLimit)more.textContent=`顯示更多（尚有 ${data.length-visibleLimit} 站）`}
async function copyKorean(ko){try{await navigator.clipboard.writeText(ko);notify(`已複製 ${ko}`)}catch{const ta=document.createElement('textarea');ta.value=ko;document.body.append(ta);ta.select();try{if(!document.execCommand('copy'))throw new Error();notify(`已複製 ${ko}`)}catch{notify('無法自動複製，請長按站名選取文字')}finally{ta.remove()}}}
for(const c of ['seoul','busan'])$('btn-'+c).addEventListener('click',()=>setCity(c));
$('mapToggle').addEventListener('click',()=>{const open=$('mapPane').hidden;$('mapPane').hidden=!open;$('mapToggle').textContent=open?'🔼 隱藏地鐵圖':'🗺️ 顯示地鐵圖';$('mapToggle').setAttribute('aria-expanded',String(open))});
$('favoritesOnly').addEventListener('click',()=>{showFavorites=!showFavorites;$('favoritesOnly').setAttribute('aria-pressed',String(showFavorites));$('favoritesOnly').classList.toggle('active',showFavorites);visibleLimit=30;render()});
$('clearSearch').addEventListener('click',()=>{$('searchInput').value='';$('lineSelect').value='';visibleLimit=30;render();$('searchInput').focus()});
$('searchInput').addEventListener('input',()=>{visibleLimit=30;render()});$('lineSelect').addEventListener('change',()=>{visibleLimit=30;render()});$('showMore').addEventListener('click',()=>{visibleLimit+=30;render()});
$('stationList').addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;if(btn.dataset.search){quickSearch(btn.dataset.search);return}if(btn.dataset.copy){const st=databases[city].find(s=>s.ko===btn.dataset.copy);if(st){historyAdd(st);copyKorean(st.ko)}return}if(btn.dataset.favorite){const ko=btn.dataset.favorite;let fav=safeRead(favoriteKey());fav=fav.includes(ko)?fav.filter(s=>s!==ko):[...fav,ko];safeSave(favoriteKey(),fav);render()}});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();$('searchInput').focus()}});
setCity('seoul');
</script>
</body></html>
